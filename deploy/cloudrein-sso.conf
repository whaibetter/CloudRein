# JD-Auth 统一密钥（SSO）
# 放到 /etc/systemd/system/cloudrein.service.d/sso.conf，然后
#   systemctl daemon-reload && systemctl restart cloudrein
# 依赖 jd-auth 的共享密钥（默认 /opt/jd-auth/data/sso.key，root 只读）。
[Service]
Environment=JD_AUTH_URL=http://117.72.196.45:12006
Environment=JD_SSO_SECRET_FILE=/opt/jd-auth/data/sso.key
Environment=CLOUDREIN_SSO_APP_ID=webdav
